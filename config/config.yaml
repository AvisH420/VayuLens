# VayuLens Decision Intelligence Layer — configuration
# Everything is driven from here. No values are hardcoded in modules.

app:
  name: "VayuLens Decision Intelligence"
  version: "1.0.0"
  log_level: "INFO"

paths:
  data_dir: "data"
  regulations_dir: "data/regulations"
  interventions_dir: "data/interventions"
  vector_store_dir: "storage/vectors"
  index_name: "vayulens"

parser:
  ocr_enabled: true
  ocr_language: "eng"
  extract_tables: true

chunking:
  # one of: sentence | semantic | heading | sliding | recursive
  strategy: "recursive"
  chunk_size: 800
  chunk_overlap: 120
  min_chunk_size: 80

embeddings:
  # provider: sentence_transformers | hash (deterministic fallback, no deps)
  # Default 'hash' boots anywhere. For production quality set:
  #   provider: sentence_transformers  (pip install .[embeddings])
  provider: "hash"
  model: "BAAI/bge-small-en-v1.5"
  dimension: 384
  normalize: true
  batch_size: 32
  fallback_dimension: 384

vector_store:
  # backend: faiss | chroma | memory
  # Default 'memory' boots anywhere. For production set faiss (pip install .[faiss]).
  backend: "memory"
  metric: "cosine"

retriever:
  # mode: dense | bm25 | hybrid
  mode: "hybrid"
  top_k: 8
  fetch_k: 30
  hybrid_alpha: 0.5          # weight of dense vs bm25 (1.0 = dense only)
  use_mmr: true
  mmr_lambda: 0.6

reranker:
  enabled: true
  # provider: cross_encoder | lexical (fallback)
  # Default 'lexical' boots anywhere. For production set cross_encoder.
  provider: "lexical"
  model: "BAAI/bge-reranker-base"
  top_n: 5

grounding:
  # Refuse to answer below this confidence. Calibrated for good separation
  # between on-topic (~0.35+) and off-topic (~0.13) queries. Raise toward 0.45
  # when using transformer embeddings + cross-encoder reranking for stricter
  # grounding.
  confidence_threshold: 0.30
  refuse_message: "I cannot answer this reliably from the available regulatory corpus. Please consult the source documents directly or refine the question."
  min_sources: 1

llm:
  # provider: openai | claude | gemini | ollama | extractive (fallback, no API)
  provider: "extractive"
  model: "gpt-4o-mini"
  temperature: 0.1
  max_tokens: 900
  # api keys read from environment: OPENAI_API_KEY / ANTHROPIC_API_KEY / GOOGLE_API_KEY
  ollama_base_url: "http://localhost:11434"

decision:
  # weights for enforcement prioritization scoring (must sum need not be 1)
  weights:
    pollution_contribution: 0.35
    population: 0.20
    hospitals: 0.15
    schools: 0.15
    forecast_trend: 0.10
    legal_urgency: 0.05

advisory:
  default_language: "en"
  supported_languages: ["en", "hi", "mr", "ta", "bn", "te"]
  audiences: ["citizen", "hospital", "school", "outdoor_worker", "senior_citizen"]

evaluation:
  k_values: [1, 3, 5, 10]
