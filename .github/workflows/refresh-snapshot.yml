name: Refresh real-data snapshot

# Runs the real Role 1->2 pipeline offline and commits fresh snapshots the API
# serves. This is what keeps the "real data" on the site live instead of frozen.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   WAQI_TOKEN            - aqicn.org data-platform token
#   OPENAQ_API_KEY        - OpenAQ key (optional; connector is skipped anyway)
#   GEE_PROJECT_ID        - Google Cloud project id registered for Earth Engine
#   GEE_SA_KEY            - full contents of the GEE service-account JSON key
#   (OPEN_ROUTER_API_KEY is NOT needed here — the assistant uses it at runtime)

on:
  schedule:
    - cron: "0 */3 * * *"     # every 3 hours (UTC)
  workflow_dispatch: {}         # manual "Run workflow" button

permissions:
  contents: write               # to commit the refreshed snapshots

concurrency:                    # never let two refreshes overlap
  group: snapshot-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          # Only what the snapshot pipeline needs — not the full geo stack.
          pip install pydantic pandas numpy requests apscheduler earthengine-api

      - name: Write GEE service-account key
        run: printf '%s' "$GEE_SA_KEY" > "$GITHUB_WORKSPACE/gee-sa-key.json"
        env:
          GEE_SA_KEY: ${{ secrets.GEE_SA_KEY }}

      - name: Build snapshots (real data)
        env:
          USE_MOCK: "false"
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          GEE_PROJECT_ID: ${{ secrets.GEE_PROJECT_ID }}
          GEE_SERVICE_ACCOUNT_KEY: ${{ github.workspace }}/gee-sa-key.json
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/build_snapshot.py --city delhi --city panaji -v

      - name: Remove the key before committing
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/gee-sa-key.json"

      - name: Commit refreshed snapshots
        run: |
          git config user.name  "vayulens-bot"
          git config user.email "actions@github.com"
          git add data/snapshots/*.json
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "chore: refresh real-data snapshot [skip ci]"
            git push
          fi
