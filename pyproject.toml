[project]
name = "vayulens-decision"
version = "0.1.0"
description = "VayuLens Role 3 — RAG Knowledge & Agentic Decision Intelligence Layer"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "VayuLens Team" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Heavy / optional providers. Core system runs without them via real fallbacks.
embeddings = ["sentence-transformers>=2.6", "torch>=2.2"]
faiss = ["faiss-cpu>=1.8"]
chroma = ["chromadb>=0.5"]
parsers = ["pypdf>=4.2", "python-docx>=1.1", "beautifulsoup4>=4.12", "lxml>=5.2"]
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17", "Pillow>=10.3"]
llm = ["openai>=1.30", "anthropic>=0.25", "google-generativeai>=0.5"]
dev = ["pytest>=8.1", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rag*", "decision*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
